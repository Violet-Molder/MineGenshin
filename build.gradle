plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {

    mavenCentral()
    // elementlib 本地开发仓库（26.2.0.4 联调期用；正式发布后换回 Maven Central）
    def elementLibLocalMaven = file('G:/AI/Codex/Skill/像素原神/maven')
    if (elementLibLocalMaven.isDirectory()) {
        maven { url = elementLibLocalMaven.toURI() }
    }
    // CI 里 elementlib 用 publishToMavenLocal 装进本机仓库后再构建
    mavenLocal()
    // LDLib2
    maven { url = "https://maven.firstdark.dev/snapshots" }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }
}
dependencies {
    // 元素体系前置库：元素注册、附着、状态容器、反应框架、计时计数器、方块环境元素
    implementation("com.linweiyun.elementlib:elementlib-neoforge-${minecraft_version}:${elementlib_version}")
    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}")
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolibVersion}"
    implementation("com.lowdragmc.photon:photon-neoforge-${minecraft_version}:${photon_version}") {
        transitive = false
    }
    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"
}
base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // 编码固定成 UTF-8；-XX:+AllowEnhancedClassRedefinition 是 JBR 专有参数，
            // 本机 toolchain（Adoptium JDK 25）不认识它，带上会直接起不来（Unrecognized VM option）。
            // 需要 JBR 热重定义混入时，把它单独加回自己的 IDE 运行配置即可。
            jvmArgument('-Dstdout.encoding=UTF-8')
            jvmArgument('-Dstderr.encoding=UTF-8')

            // 跳过mod加载警告弹窗（如已弃用的logoFile等）
            systemProperty 'neoforge.modLoadingWarningScreen.skip', 'true'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // worktree 自己的 run/ 是空的：用它启动会看不到主检出的存档与设置（像开了一个新项目）。
            // 默认复用同级主检出（../MineGenshin/run）的游戏目录；那里不存在（CI / 别的机器 / 独立检出）
            // 就退回 worktree 自己的 run/。想强制用本目录的 run/：加 -PmgIsolatedRun
            def sharedRunDir = file('../MineGenshin/run')
            if (!providers.gradleProperty('mgIsolatedRun').isPresent() && sharedRunDir.isDirectory()) {
                gameDirectory = sharedRunDir
            }

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // 临时目录指到项目内（build/dev-temp）：Codex 会话给 C 盘的 %TEMP% 加了沙箱 ACL，
            // JDK 在那建 NIO selector 的自连接管道（unix socket）会失败 ——
            // 表现为打开单人存档时崩在 "Load world / Unable to establish loopback connection"。
            // 这里指的是项目自己的 build 目录（已被 gitignore），与前面几行一样对所有运行配置生效。
            def devTempDir = layout.buildDirectory.dir('dev-temp').get().asFile
            devTempDir.mkdirs()
            environment 'TEMP', devTempDir.absolutePath
            environment 'TMP', devTempDir.absolutePath
            systemProperty 'java.io.tmpdir', devTempDir.absolutePath
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// ==================== 本地联调：联动方（IB）与它的前置 ====================
// 只进开发运行环境（runClient / runServer / runData），不进产物、不影响发布构建。
//
// 只认 26.2 的 IB 产物：IB 那个仓库同时在放 1.21.1 线，它的 build/libs 会被那一边的构建覆盖，
// 所以这里逐个读 jar 里的 neoforge.mods.toml 核对 minecraft 版本区间，不是 26.2 的一律跳过并说明原因。
//
// 查找顺序（先找到先算）：
//   1. -PibLocalJar=<jar> 显式指定；
//   2. 本项目的本地依赖目录 libs/imaginary_branch-*.jar（jar 不进仓库，见 .gitignore）；
//   3. IB 仓库的 build/libs/26.2-imaginary_branch-*.jar（-PibLocalDir=... 可改）。
// IB 的必需前置里，geckolib 与 photon 本项目本来就有，只差 Curios，所以联调期一起带上。
def ibJarIs262 = { File jar ->
    if (jar == null || !jar.isFile()) {
        return false
    }
    def zip = new java.util.zip.ZipFile(jar)
    try {
        def entry = zip.getEntry('META-INF/neoforge.mods.toml')
        return entry != null
                && (zip.getInputStream(entry).getText('UTF-8') =~ /versionRange\s*=\s*"\[26\.2\]"/).find()
    } finally {
        zip.close()
    }
}

def ibJarCandidates = []
def ibExplicitJar = providers.gradleProperty('ibLocalJar').getOrElse('')
if (!ibExplicitJar.isEmpty()) {
    ibJarCandidates << file(ibExplicitJar)
}
ibJarCandidates.addAll(fileTree(file('libs')) {
    include '*imaginary_branch-*.jar'
    exclude '*-sources.jar', '*-javadoc.jar'
}.files.sort())
def ibRepoDir = file(providers.gradleProperty('ibLocalDir').getOrElse('E:/MCMOD/IB-wt-26.2'))
ibJarCandidates.addAll(fileTree(new File(ibRepoDir, 'build/libs')) {
    include '*imaginary_branch-*.jar'
    exclude '*-sources.jar', '*-javadoc.jar'
}.files.sort())

def ibJar = ibJarCandidates.find { ibJarIs262(it) }
def ibSkippedJars = ibJarCandidates.findAll { it.isFile() && !ibJarIs262(it) }

if (ibJar != null) {
    repositories {
        maven { url = 'https://maven.theillusivec4.top/' }
    }
    dependencies {
        localRuntime files(ibJar)
        localRuntime 'top.theillusivec4.curios:curios-neoforge:16.0.0+26.2'
    }
    logger.lifecycle("[IB联动] 开发环境将加载 IB（26.2）：${ibJar}，外加 Curios 16.0.0+26.2")
    if (!ibSkippedJars.isEmpty()) {
        logger.lifecycle("[IB联动] 已跳过不是 26.2 的 IB 产物：${ibSkippedJars*.name.join(', ')}")
    }
} else {
    def reason = ibSkippedJars.isEmpty()
            ? '没找到 IB 产物'
            : "找到的 IB 产物都不是 26.2 的（${ibSkippedJars*.name.join(', ')}）"
    logger.lifecycle("[IB联动] ${reason}，本次开发环境不加载 IB；"
            + "请把 IB 26.2 的 jar 放到本项目的 libs/ 目录，或用 -PibLocalJar=<jar> 指定")
}



// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 可选的本地构建扩展：文件在就加载，不在就跳过（只有下面这几行）。
def privateBuildScript = file('src/private/gradle/private-build.gradle')
if (privateBuildScript.isFile()) {
    apply from: privateBuildScript
}
