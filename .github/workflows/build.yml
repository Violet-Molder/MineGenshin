name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # elementlib 的新版本还没进 Maven Central：CI 里就地构建同名分支，装进本机 maven 仓库
      - name: Checkout elementlib
        uses: actions/checkout@v4
        with:
          repository: Violet-Molder/elementlib
          ref: ${{ github.head_ref || github.ref_name }}
          path: elementlib

      - name: Publish elementlib to local maven
        working-directory: elementlib
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal -x signMavenJavaPublication

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build
